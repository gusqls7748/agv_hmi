# Ubuntu에서 /etc/nginx/conf.d/guide-robot-webhmi.conf 로 저장하는 예시입니다.
# conf.d 파일은 nginx의 http 영역에서 불러와지므로 map 사용이 가능합니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Blazor Server의 SignalR 연결이 오래 유지될 수 있습니다.
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 웹 브라우저가 C++ 로봇 제어 API를 직접 호출할 필요는 없습니다.
    # Blazor 서버 프로세스가 127.0.0.1:8080으로 호출하므로, 공개 URL에서는 막습니다.
    location ^~ /api/ {
        return 404;
    }
}
